# ==============================================================================
# Nginx Configuration for BIS Intelligent Platform Web (Vite SPA)
# Hardened, Unprivileged Non-Root Reverse Proxy & Static Asset Server
# ==============================================================================

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────────────────────────────────
    # Temporary Paths for Read-Only Root Filesystem Compatibility
    # ─────────────────────────────────────────────────────────────────────────
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # ─────────────────────────────────────────────────────────────────────────
    # Security Headers
    # ─────────────────────────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none';" always;

    # ─────────────────────────────────────────────────────────────────────────
    # Compression (Gzip)
    # ─────────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ─────────────────────────────────────────────────────────────────────────
    # Health Probe
    # ─────────────────────────────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Hashed Static Assets (Immutable Cache)
    # ─────────────────────────────────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # SPA HTML5 Fallback
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache index.html so updates are immediately discovered
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Disable access to hidden/dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
