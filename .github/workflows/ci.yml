name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Quality Gates (Typecheck, Lint, Tests, Production Build)
  # ─────────────────────────────────────────────────────────────────────────────
  quality-gates:
    name: Quality Gates & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Code Quality
        run: npm run lint

      - name: Unit & Integration Tests (100% Pass Required)
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: "test-jwt-secret-key-32-chars-long-minimum!!"
          DATABASE_URL: "postgresql://test:test@localhost:5432/test_db"
          STORAGE_PROVIDER: "local"
          AI_PROVIDER: "mock"
          VERIFICATION_PROVIDER: "mock"
          JOB_QUEUE_PROVIDER: "memory"

      - name: Production Bundling Verification
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Container Validation (Docker Build & Compose Verification)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-validation:
    name: Container Build & Compose Validation
    runs-on: ubuntu-latest
    needs: quality-gates
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate API Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: bis-api:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Web Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: bis-web:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Production Docker Compose Manifest
        run: |
          docker compose -f docker-compose.prod.yml config --quiet
        env:
          DATABASE_URL: "postgresql://dummy_user:dummy_pass@dummy_host:5432/bis_compliance"
          JWT_SECRET: "super-secure-production-jwt-secret-minimum-32-chars"
          STORAGE_BUCKET: "bis-compliance-documents-prod"
          STORAGE_ACCESS_KEY_ID: "DUMMY_ACCESS_KEY"
          STORAGE_SECRET_ACCESS_KEY: "DUMMY_SECRET_KEY"
