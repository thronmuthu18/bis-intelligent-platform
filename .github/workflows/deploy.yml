name: Production Deployment Pipeline

# ==============================================================================
# Production Deployment Workflow
# Trigger: MANUAL DISPATCH ONLY (workflow_dispatch)
# Target: AWS Staging / Production Infrastructure
# Authentication: GitHub OIDC Role Assumption (No static AWS access keys)
# Container Registry: Amazon Elastic Container Registry (ECR)
# Orchestration: Amazon Elastic Container Service (ECS Fargate)
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_migrations:
        description: 'Execute database schema migration (npx prisma migrate deploy)'
        required: true
        default: true
        type: boolean
      deploy_api:
        description: 'Deploy API backend container'
        required: true
        default: true
        type: boolean
      deploy_web:
        description: 'Deploy Web frontend container'
        required: true
        default: true
        type: boolean
      confirmation:
        description: 'Type "CONFIRM" to proceed with deployment'
        required: true
        default: ''
        type: string

# Top-level permissions required for GitHub OIDC token minting
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::758808001260:role/bis-staging-github-actions-deploy-role
  ECR_REGISTRY: 758808001260.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Safety Verification & Guardrail Check
  # ─────────────────────────────────────────────────────────────────────────────
  deployment-guard:
    name: Guardrail Verification
    runs-on: ubuntu-latest
    steps:
      - name: Verify Confirmation String
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "CONFIRM" ]; then
            echo "::error::Deployment aborted! Confirmation input was not 'CONFIRM'."
            exit 1
          fi
          echo "Guardrail verification passed for environment: ${{ github.event.inputs.target_environment }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Database Migration Execution (Idempotent, Zero-Downtime Safe)
  # ─────────────────────────────────────────────────────────────────────────────
  database-migration:
    name: Apply Database Migrations
    runs-on: ubuntu-latest
    needs: deployment-guard
    if: ${{ github.event.inputs.run_migrations == 'true' }}
    environment: ${{ github.event.inputs.target_environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # ───────────────────────────────────────────────────────────────────────
      # CRITICAL PRODUCTION SAFETY NOTICE:
      # ONLY 'prisma migrate deploy' is permissible in production!
      # NEVER run 'prisma migrate reset' or 'prisma db push' in production.
      # ───────────────────────────────────────────────────────────────────────
      - name: Run Safe Prisma Migration Deploy
        run: |
          echo "Applying pending migrations using 'npx prisma migrate deploy'..."
          npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Container Build & Push to Amazon ECR (OIDC Authenticated)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push-images:
    name: Build & Push ECR Images
    runs-on: ubuntu-latest
    needs: [deployment-guard, database-migration]
    if: always() && (needs.deployment-guard.result == 'success') && (needs.database-migration.result == 'success' || needs.database-migration.result == 'skipped')
    environment: ${{ github.event.inputs.target_environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || env.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push API Container Image
        if: ${{ github.event.inputs.deploy_api == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/bis-${{ github.event.inputs.target_environment }}-api:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/bis-${{ github.event.inputs.target_environment }}-api:latest

      - name: Build and Push Web Container Image
        if: ${{ github.event.inputs.deploy_web == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/bis-${{ github.event.inputs.target_environment }}-web:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/bis-${{ github.event.inputs.target_environment }}-web:latest
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api/v1' }}

  # ─────────────────────────────────────────────────────────────────────────────
  # ECS Service Rollout, Stabilization & Healthcheck Verification
  # ─────────────────────────────────────────────────────────────────────────────
  rollout:
    name: ECS Service Rollout & Healthcheck
    runs-on: ubuntu-latest
    needs: build-and-push-images
    environment: ${{ github.event.inputs.target_environment }}
    steps:
      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || env.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Update ECS API Task Definition & Service
        if: ${{ github.event.inputs.deploy_api == 'true' }}
        run: |
          API_IMAGE="${{ env.ECR_REGISTRY }}/bis-${{ github.event.inputs.target_environment }}-api:${{ github.sha }}"
          FAMILY="bis-${{ github.event.inputs.target_environment }}-api"
          SERVICE="bis-${{ github.event.inputs.target_environment }}-api-service"
          CLUSTER="bis-${{ github.event.inputs.target_environment }}-cluster"

          echo "Fetching active task definition for family: $FAMILY"
          aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --region "${{ vars.AWS_REGION || env.AWS_REGION }}" > td_api.json

          echo "Pruning read-only attributes and setting image to: $API_IMAGE"
          jq --arg IMAGE "$API_IMAGE" '
            .taskDefinition
            | .containerDefinitions |= map(if .name == "api" then .image = $IMAGE else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' td_api.json > new_td_api.json

          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new_td_api.json \
            --region "${{ vars.AWS_REGION || env.AWS_REGION }}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "Registered new API task definition: $NEW_TASK_ARN"

          echo "Updating ECS service $SERVICE..."
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$NEW_TASK_ARN" \
            --region "${{ vars.AWS_REGION || env.AWS_REGION }}"
          echo "API service update triggered successfully."

      - name: Update ECS Web Task Definition & Service
        if: ${{ github.event.inputs.deploy_web == 'true' }}
        run: |
          WEB_IMAGE="${{ env.ECR_REGISTRY }}/bis-${{ github.event.inputs.target_environment }}-web:${{ github.sha }}"
          FAMILY="bis-${{ github.event.inputs.target_environment }}-web"
          SERVICE="bis-${{ github.event.inputs.target_environment }}-web-service"
          CLUSTER="bis-${{ github.event.inputs.target_environment }}-cluster"

          echo "Fetching active task definition for family: $FAMILY"
          aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --region "${{ vars.AWS_REGION || env.AWS_REGION }}" > td_web.json

          echo "Pruning read-only attributes and setting image to: $WEB_IMAGE"
          jq --arg IMAGE "$WEB_IMAGE" '
            .taskDefinition
            | .containerDefinitions |= map(if .name == "web" then .image = $IMAGE else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' td_web.json > new_td_web.json

          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new_td_web.json \
            --region "${{ vars.AWS_REGION || env.AWS_REGION }}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "Registered new Web task definition: $NEW_TASK_ARN"

          echo "Updating ECS service $SERVICE..."
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$NEW_TASK_ARN" \
            --region "${{ vars.AWS_REGION || env.AWS_REGION }}"
          echo "Web service update triggered successfully."

      - name: Wait for ECS Services to Become Stable
        run: |
          CLUSTER="bis-${{ github.event.inputs.target_environment }}-cluster"
          SERVICES=()
          if [ "${{ github.event.inputs.deploy_api }}" == "true" ]; then
            SERVICES+=("bis-${{ github.event.inputs.target_environment }}-api-service")
          fi
          if [ "${{ github.event.inputs.deploy_web }}" == "true" ]; then
            SERVICES+=("bis-${{ github.event.inputs.target_environment }}-web-service")
          fi

          if [ ${#SERVICES[@]} -gt 0 ]; then
            echo "Waiting for services to stabilize: ${SERVICES[*]}"
            aws ecs wait services-stable \
              --cluster "$CLUSTER" \
              --services "${SERVICES[@]}" \
              --region "${{ vars.AWS_REGION || env.AWS_REGION }}"
            echo "All target ECS services are now stable."
          else
            echo "No services selected for deployment."
          fi

      - name: Run Staging Deployment Health Checks
        run: |
          ALB_NAME="bis-${{ github.event.inputs.target_environment }}-alb"
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "$ALB_NAME" \
            --region "${{ vars.AWS_REGION || env.AWS_REGION }}" \
            --query "LoadBalancers[0].DNSName" \
            --output text 2>/dev/null || echo "")

          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" == "None" ]; then
            ALB_DNS="bis-staging-alb-760893208.ap-south-1.elb.amazonaws.com"
          fi
          echo "Target Load Balancer DNS: $ALB_DNS"

          if [ "${{ github.event.inputs.deploy_api }}" == "true" ]; then
            echo "Checking API Live Endpoint (http://$ALB_DNS/api/v1/health/live)..."
            API_HEALTHY=false
            for i in {1..30}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "http://$ALB_DNS/api/v1/health/live" || echo "000")
              if [ "$STATUS" -eq 200 ]; then
                echo "API live health check succeeded (HTTP 200) on attempt $i."
                API_HEALTHY=true
                break
              fi
              echo "Attempt $i/30: API returned HTTP $STATUS. Waiting 5 seconds..."
              sleep 5
            done

            if [ "$API_HEALTHY" != "true" ]; then
              echo "::error::API health check failed after 30 attempts."
              exit 1
            fi
          fi

          if [ "${{ github.event.inputs.deploy_web }}" == "true" ]; then
            echo "Checking Web Health Endpoint (http://$ALB_DNS/healthz)..."
            WEB_HEALTHY=false
            for i in {1..30}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "http://$ALB_DNS/healthz" || echo "000")
              if [ "$STATUS" -eq 200 ]; then
                echo "Web health check succeeded (HTTP 200) on attempt $i."
                WEB_HEALTHY=true
                break
              fi
              echo "Attempt $i/30: Web returned HTTP $STATUS. Waiting 5 seconds..."
              sleep 5
            done

            if [ "$WEB_HEALTHY" != "true" ]; then
              echo "::error::Web health check failed after 30 attempts."
              exit 1
            fi
          fi

          echo "======================================================================"
          echo "DEPLOYMENT AND HEALTH VERIFICATION COMPLETED SUCCESSFULLY"
          echo "Environment: ${{ github.event.inputs.target_environment }}"
          echo "Commit: ${{ github.sha }}"
          echo "ALB URL: http://$ALB_DNS"
          echo "======================================================================"
