name: Production Deployment Pipeline

# ==============================================================================
# Production Deployment Workflow
# Trigger: MANUAL DISPATCH ONLY (workflow_dispatch)
# Automated deployment is strictly disabled until Phase 15C.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_migrations:
        description: 'Execute database schema migration (npx prisma migrate deploy)'
        required: true
        default: true
        type: boolean
      deploy_api:
        description: 'Deploy API backend container'
        required: true
        default: true
        type: boolean
      deploy_web:
        description: 'Deploy Web frontend container'
        required: true
        default: true
        type: boolean
      confirmation:
        description: 'Type "CONFIRM" to proceed with deployment'
        required: true
        default: ''
        type: string

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Safety Verification & Guardrail Check
  # ─────────────────────────────────────────────────────────────────────────────
  deployment-guard:
    name: Guardrail Verification
    runs-on: ubuntu-latest
    steps:
      - name: Verify Confirmation String
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "CONFIRM" ]; then
            echo "::error::Deployment aborted! Confirmation input was not 'CONFIRM'."
            exit 1
          fi
          echo "Guardrail verification passed for environment: ${{ github.event.inputs.target_environment }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Database Migration Execution (Idempotent, Zero-Downtime Safe)
  # ─────────────────────────────────────────────────────────────────────────────
  database-migration:
    name: Apply Database Migrations
    runs-on: ubuntu-latest
    needs: deployment-guard
    if: ${{ github.event.inputs.run_migrations == 'true' }}
    environment: ${{ github.event.inputs.target_environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # ───────────────────────────────────────────────────────────────────────
      # CRITICAL PRODUCTION SAFETY NOTICE:
      # ONLY 'prisma migrate deploy' is permissible in production!
      # NEVER run 'prisma migrate reset' or 'prisma db push' in production.
      # ───────────────────────────────────────────────────────────────────────
      - name: Run Safe Prisma Migration Deploy
        run: |
          echo "Applying pending migrations using 'npx prisma migrate deploy'..."
          npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Container Build & Push (Placeholder - Ready for AWS ECR / GHCR)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push-images:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    needs: [deployment-guard, database-migration]
    if: always() && (needs.deployment-guard.result == 'success') && (needs.database-migration.result == 'success' || needs.database-migration.result == 'skipped')
    environment: ${{ github.event.inputs.target_environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Example placeholder for AWS ECR or GitHub Container Registry (GHCR)
      # - name: Log in to Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ secrets.CONTAINER_REGISTRY }}
      #     username: ${{ secrets.REGISTRY_USERNAME }}
      #     password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build API Container Image
        if: ${{ github.event.inputs.deploy_api == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false # Set to true once Container Registry secrets are configured
          tags: bis-api:${{ github.sha }},bis-api:latest

      - name: Build Web Container Image
        if: ${{ github.event.inputs.deploy_web == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false # Set to true once Container Registry secrets are configured
          tags: bis-web:${{ github.sha }},bis-web:latest
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api/v1' }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Production Rollout & Healthcheck Verification
  # ─────────────────────────────────────────────────────────────────────────────
  rollout:
    name: Service Rollout & Healthcheck
    runs-on: ubuntu-latest
    needs: build-and-push-images
    environment: ${{ github.event.inputs.target_environment }}
    steps:
      - name: Trigger Rolling Deployment (Pending Cloud Target Provisioning)
        run: |
          echo "======================================================================"
          echo "PHASE 15B PREPARATION COMPLETE."
          echo "Deployment target: ${{ github.event.inputs.target_environment }}"
          echo "Containers built and ready for registry push."
          echo "Cloud resources (ECS / EKS / AppRunner / VPS) to be provisioned in Phase 15C."
          echo "No external deployment executed."
          echo "======================================================================"
